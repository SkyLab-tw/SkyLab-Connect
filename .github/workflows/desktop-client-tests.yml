name: Desktop Client Tests

on:
  pull_request:
  push:
    branches: [main, "release/skylab-connect-v*", "archive/**"]

concurrency:
  group: desktop-client-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: lint + audit + build
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit and service regression tests
        run: npm test

      - name: Audit dependencies
        run: npm run audit:security

      - name: Production build
        run: npm run build

      - name: Test connection status after operation failures
        run: npm run test:connection-ui
