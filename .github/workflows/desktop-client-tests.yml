name: Desktop Client Tests

on:
  pull_request:
  push:
    branches: [main, "release/skylab-connect-v*", "archive/**"]

concurrency:
  group: desktop-client-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Match the protected branch's required contexts with real service and UI tests.
  services:
    name: Backend Tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Electron service regression tests
        run: npm test

  renderer:
    name: Frontend Tests
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Audit dependencies
        run: npm run audit:security

      - name: Production build
        run: npm run build

      - name: Test connection status after operation failures
        run: npm run test:connection-ui

  macos:
    name: macOS Tests
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Electron service regression tests
        run: npm test
      - name: Build unsigned universal DMG
        run: npm run build:electron:mac:unsigned
